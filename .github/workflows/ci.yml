name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: fast (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: game tests
        run: npm test
      - name: online service tests
        run: npm run test:online
      - name: bundle is fresh
        run: |
          npm run build
          git diff --exit-code -- js/game.bundle.js
      - name: determinism fingerprint
        run: node test/golden.cjs

  balance:
    name: balance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: AI-vs-AI balance thresholds
        run: npm run test:balance

  ui:
    name: ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: install Chromium
        run: npx playwright install --with-deps chromium
      - name: renderer smoke, UI flow and audio
        run: npm run test:ui
